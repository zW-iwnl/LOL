services:
  postgres:
    image: postgres:16
    container_name: test_manager_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-test_manager}
      POSTGRES_USER: ${POSTGRES_USER:-test_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_manager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: test_manager_backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      SEED_DEMO_DATA: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-test_manager}:${POSTGRES_PASSWORD:-test_manager}@postgres:5432/${POSTGRES_DB:-test_manager}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: build
    container_name: test_manager_frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    command: ["/bin/sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    profiles:
      - docs
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -t
      - pgsql
      - -host
      - postgres
      - -port
      - "5432"
      - -db
      - ${POSTGRES_DB:-test_manager}
      - -u
      - ${POSTGRES_USER:-test_manager}
      - -p
      - ${POSTGRES_PASSWORD:-test_manager}
      - -s
      - ${SCHEMASPY_SCHEMA:-public}
    volumes:
      - ./docs/database-reference:/output
    restart: "no"

volumes:
  postgres_data:
  frontend_node_modules:
